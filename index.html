<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="banner" ><img class="logo" src="./images/odin-lined.png" alt="odin logo"><span>ODIN</span></div>
        <div class="background-credits">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on 
            <a href="https://unsplash.com">Unsplash</a>
        </div>
    </div>
    <div class="form-page">
        <header>
            <div>
                <h1>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</h1>
                <h1>You <em>know</em> you want to.</h1>
            </div>
            
        </header>
        <div class="form-container">
            <h1>Let's do this!</h1>
            <form id="signup-form" action="index.html">
                <div>
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name">
                </div>
                <div>
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name">
                </div>
                <div>
                    <label for="user-email">EMAIL</label>
                    <input type="email" id="user-email" name="email">
                </div>
                <div>
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div>
                    <label for="user-password">PASSWORD</label>
                    <input type="password" id="user-password" name="password" required>
                </div>
                <div>
                    <label for="password-checker">CONFIRM PASSWORD</label>
                    <input type="password" id="password-checker" name="password-checker" required>
                </div>
            </form>
        </div>
        <footer>
            <button type="submit" form="signup-form">Create Account</button>
            <p>Already have an account? <a class="login" href="">Log in</a></p>
        </footer>
    </div>
    
</body>
</html>
